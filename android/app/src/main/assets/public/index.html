<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Par Odin — Jeu de Dés 3D</title>
    <meta
      name="description"
      content="Jeu de dés et casse-tête tactique nordique en 3D : répartis les guerriers et Fenrir en deux armées égales."
    />
    <meta property="og:title" content="Par Odin — Jeu de Dés 3D" />
    <meta
      property="og:description"
      content="Jeu de dés et casse-tête tactique nordique en 3D : répartis les guerriers et Fenrir en deux armées égales."
    />
    <meta name="theme-color" content="#1e130c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Par Odin" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script type="module" crossorigin src="/assets/index-DbcxnsWu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-0P2eEDxn.css">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"></head>
  <body>
    <div id="app">
      <canvas id="board-canvas" aria-label="Plateau de jeu 3D Par Odin"></canvas>
      <svg id="aid-links" aria-hidden="true"></svg>
      <div id="aid-badges" aria-hidden="true"></div>
      <div id="zone-banners" aria-hidden="true">
        <div id="banner-left" class="zone-banner left">
          <span class="zone-name">Armée Gauche</span>
          <span class="zone-score" id="score-left"></span>
        </div>
        <div id="banner-right" class="zone-banner right">
          <span class="zone-name">Armée Droite</span>
          <span class="zone-score" id="score-right"></span>
        </div>
      </div>

      <div id="top-hud">
        <header id="top-bar">
          <div class="brand">
            <span class="brand-rune">ᛟ</span>
            <h1>PAR ODIN</h1>
          </div>
          <nav class="mode-tabs" role="tablist" aria-label="Modes de jeu">
            <button class="tab-btn active" data-mode="campaign" role="tab">Campagne (18)</button>
            <button class="tab-btn" data-mode="generator" role="tab">Générateur</button>
            <button class="tab-btn" data-mode="freeroll" role="tab">Lancer libre</button>
          </nav>
          <div class="top-tools">
            <button id="btn-landscape" class="tool-btn install-btn hidden" title="Passer en plein écran paysage">
              📱 <span>Paysage</span>
            </button>
            <button id="btn-install" class="tool-btn install-btn hidden" title="Installer l'application sur mobile">
              📲 <span>Installer</span>
            </button>
            <button id="btn-aid" class="tool-btn" title="Basculer entre Mode Puriste et Mode Aide">
              <span class="dot"></span>
              <span id="aid-label">Mode Puriste</span>
            </button>
            <button id="btn-rules" class="tool-btn" title="Aide-mémoire des règles">Règles</button>
            <button id="btn-camera" class="tool-btn icon-only" title="Recentrer la caméra">⌖</button>
            <button id="btn-sound" class="tool-btn icon-only" title="Couper ou activer le son">🔊</button>
          </div>
        </header>

        <section id="context-bar" aria-live="polite"></section>
      </div>

      <div id="toast" class="toast hidden" role="status" aria-live="assertive"></div>

      <div id="solution-bar" class="solution-bar hidden">
        <div class="solution-header">
          <span id="solution-eq" class="solution-eq"></span>
          <div class="solution-nav" id="solution-nav">
            <button id="btn-sol-prev" class="mini-btn" aria-label="Solution précédente">◀</button>
            <span id="solution-index">1 / 1</span>
            <button id="btn-sol-next" class="mini-btn" aria-label="Solution suivante">▶</button>
          </div>
          <button id="btn-sol-close" class="mini-btn">Reprendre</button>
        </div>
      </div>

      <footer id="action-bar">
        <button id="btn-verify" class="action-btn primary">Vérifier la bataille</button>
        <button id="btn-impossible" class="action-btn warn hidden">Déclarer impossible !</button>
        <button id="btn-hint" class="action-btn">Indice</button>
        <button id="btn-solution" class="action-btn">Voir la solution</button>
        <button id="btn-reset" class="action-btn subtle">Réserve</button>
      </footer>

      <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div>
      </div>
    </div>
  </body>
</html>
