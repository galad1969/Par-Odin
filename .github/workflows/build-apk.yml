name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            (yes || true) | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies & sync Capacitor
        run: |
          npm install
          npm run android:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Par Odin APK
        uses: actions/upload-artifact@v4
        with:
          name: par-odin-3d-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
